<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Virtual Pendrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-canvas">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary mx-auto mb-3">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <h1 id="authTitle" class="font-serif font-normal text-primary text-3xl tracking-tight mb-1">Sign in</h1>
    <p class="text-sm text-muted">Access your Virtual Pendrive</p>
  </div>

  <div class="bg-surface-card border border-hairline rounded-2xl overflow-hidden">
    <div class="h-1 bg-primary"></div>
    <div class="p-6">
      <div id="errorBox" class="bg-error/8 text-error px-4 py-2 rounded-lg text-sm mb-4 hidden"></div>

      <div class="flex flex-col gap-3.5">
        <input id="emailInput" type="email" placeholder="Email" class="w-full h-10 px-3.5 py-2.5 rounded-lg border border-hairline bg-surface-card text-ink text-sm outline-none focus:border-primary focus:ring-3 focus:ring-primary/12" autocomplete="email">
        <input id="passwordInput" type="password" placeholder="Password" class="w-full h-10 px-3.5 py-2.5 rounded-lg border border-hairline bg-surface-card text-ink text-sm outline-none focus:border-primary focus:ring-3 focus:ring-primary/12" autocomplete="current-password">
        <div class="flex justify-end">
          <button id="forgotBtn" onclick="handleReset()" class="bg-transparent border-none text-sm text-muted cursor-pointer px-0 py-1 hover:text-primary">Forgot password?</button>
        </div>
        <button id="authBtn" class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active w-full justify-center inline-flex items-center" onclick="handleAuth()">Sign in</button>
      </div>

      <div class="my-6 relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-hairline"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="bg-surface-card px-2 text-xs text-muted-soft">or</span>
        </div>
      </div>

      <button class="bg-surface-card border border-hairline text-ink rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-surface-soft w-full justify-center inline-flex items-center" onclick="handleGoogle()">
        <svg width="16" height="16" viewBox="0 0 24 24" class="mr-2 shrink-0">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <p class="text-center text-sm text-muted mt-5">
        <span id="toggleLabel">Don't have an account?</span>
        <button id="toggleBtn" onclick="toggleMode()" class="bg-transparent border-none text-sm font-medium text-primary cursor-pointer px-0 ml-1">
          Create one
        </button>
      </p>
    </div>
  </div>

  <p class="text-center text-xs mt-5 text-muted-soft">
    <a href="/" class="text-muted-soft underline hover:text-primary">Back to home</a> &middot; Free plan includes 1 GB storage
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  storageBucket: "vdrive-64deb.firebasestorage.app",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const auth = firebase.auth()
let isRegister = false

function authErrorMessage(e) {
  const m = { 'invalid-credential':'Incorrect email or password', 'user-not-found':'Incorrect email or password', 'wrong-password':'Incorrect email or password', 'email-already-in-use':'An account with this email already exists', 'weak-password':'Password must be at least 6 characters', 'invalid-email':'Invalid email address', 'too-many-requests':'Too many attempts. Try again later.', 'network-request-failed':'Network error. Check your connection.', 'popup-closed-by-user':'Sign-in was cancelled' }
  const c = e.code || ''
  for (const k in m) { if (c.includes(k)) return m[k] }
  return 'Something went wrong'
}

function handleReset() {
  const email = document.getElementById('emailInput').value
  if (!email) { showError('Enter your email first'); return }
  auth.sendPasswordResetEmail(email)
    .then(() => showError('Password reset email sent! Check your inbox.'))
    .catch(e => showError(authErrorMessage(e)))
}

function toggleMode() {
  isRegister = !isRegister
  document.getElementById('authTitle').textContent = isRegister ? 'Create account' : 'Sign in'
  document.getElementById('authTitle').nextElementSibling.textContent = isRegister ? 'Start your free Virtual Pendrive' : 'Access your Virtual Pendrive'
  document.getElementById('authBtn').textContent = isRegister ? 'Create account' : 'Sign in'
  document.getElementById('forgotBtn').style.display = isRegister ? 'none' : 'block'
  document.getElementById('toggleLabel').textContent = isRegister ? 'Already have an account?' : "Don't have an account?"
  document.getElementById('toggleBtn').textContent = isRegister ? 'Sign in' : 'Create one'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
  else { el.classList.add('hidden'); }
}

async function handleAuth() {
  const email = document.getElementById('emailInput').value
  const password = document.getElementById('passwordInput').value
  showError('')
  try {
    if (isRegister) await auth.createUserWithEmailAndPassword(email, password)
    else await auth.signInWithEmailAndPassword(email, password)
    window.location.href = '/dashboard.html'
  } catch (e) { showError(authErrorMessage(e)) }
}

async function handleGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider()
  try {
    await auth.signInWithPopup(provider)
    window.location.href = '/dashboard.html'
  } catch (e) { showError(authErrorMessage(e)) }
}

auth.onAuthStateChanged(user => { if (user) window.location.href = '/dashboard.html' })
</script>
</body>
</html>
