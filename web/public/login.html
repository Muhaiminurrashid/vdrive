<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Virtual Pendrive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--canvas);">

<div style="width: 100%; max-width: 380px;">
  <div class="text-center" style="margin-bottom: 32px;">
    <h1 id="authTitle" style="font-family: var(--font-serif); font-size: 1.8rem; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 4px;">Sign in</h1>
    <p class="text-sm text-muted">Access your Virtual Pendrive</p>
  </div>

  <div class="card">
    <div id="errorBox" class="error-banner" style="display: none;"></div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <input id="emailInput" type="email" placeholder="Email" class="input" autocomplete="email">
      <input id="passwordInput" type="password" placeholder="Password" class="input" autocomplete="current-password">
      <div style="display: flex; justify-content: flex-end;">
        <button id="forgotBtn" onclick="handleReset()" style="background: none; border: none; font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0;" class="text-sm text-muted">Forgot password?</button>
      </div>
      <button id="authBtn" class="btn-primary" style="width: 100%; justify-content: center;" onclick="handleAuth()">Sign in</button>
    </div>

    <div class="my-6" style="position: relative;">
      <div style="position: absolute; inset: 0; display: flex; align-items: center;">
        <div style="width: 100%; border-top: 1px solid var(--hairline);"></div>
      </div>
      <div style="position: relative; display: flex; justify-content: center;">
        <span style="background: var(--surface-card); padding: 0 8px; font-size: 12px; color: var(--muted);">or</span>
      </div>
    </div>

    <button class="btn-secondary" style="width: 100%; justify-content: center;" onclick="handleGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right: 8px;">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <p class="text-center text-sm text-muted" style="margin-top: 20px;">
      <span id="toggleLabel">Don't have an account?</span>
      <button id="toggleBtn" onclick="toggleMode()" style="background: none; border: none; font-size: 14px; font-weight: 500; color: var(--primary); cursor: pointer; padding: 0; margin-left: 4px;">
        Create one
      </button>
    </p>
  </div>

  <p class="text-center text-xs" style="margin-top: 20px; color: var(--muted-soft);">
    <a href="/" style="color: var(--muted-soft); text-decoration: underline;">Back to home</a> &middot; Free plan includes 1 GB storage
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  storageBucket: "vdrive-64deb.firebasestorage.app",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const auth = firebase.auth()
let isRegister = false

function handleReset() {
  const email = document.getElementById('emailInput').value
  if (!email) { showError('Enter your email first'); return }
  auth.sendPasswordResetEmail(email)
    .then(() => showError('Password reset email sent! Check your inbox.'))
    .catch(e => showError(e.message))
}

function toggleMode() {
  isRegister = !isRegister
  document.getElementById('authTitle').textContent = isRegister ? 'Create account' : 'Sign in'
  document.getElementById('authTitle').nextElementSibling.textContent = isRegister ? 'Start your free Virtual Pendrive' : 'Access your Virtual Pendrive'
  document.getElementById('authBtn').textContent = isRegister ? 'Create account' : 'Sign in'
  document.getElementById('forgotBtn').style.display = isRegister ? 'none' : 'block'
  document.getElementById('toggleLabel').textContent = isRegister ? 'Already have an account?' : "Don't have an account?"
  document.getElementById('toggleBtn').textContent = isRegister ? 'Sign in' : 'Create one'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

async function handleAuth() {
  const email = document.getElementById('emailInput').value
  const password = document.getElementById('passwordInput').value
  showError('')
  try {
    if (isRegister) await auth.createUserWithEmailAndPassword(email, password)
    else await auth.signInWithEmailAndPassword(email, password)
    window.location.href = '/dashboard.html'
  } catch (e) { showError(e.message) }
}

async function handleGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider()
  try {
    await auth.signInWithPopup(provider)
    window.location.href = '/dashboard.html'
  } catch (e) { showError(e.message) }
}

auth.onAuthStateChanged(user => { if (user) window.location.href = '/dashboard.html' })
</script>
</body>
</html>
