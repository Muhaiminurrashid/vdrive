<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Virtual Pendrive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--canvas);">

<div style="width: 100%; max-width: 380px;">
  <div class="text-center" style="margin-bottom: 32px;">
    <h1 style="font-family: var(--font-serif); font-size: 1.8rem; font-weight: 500; color: var(--ink); margin-bottom: 4px;">Reset password</h1>
    <p class="text-sm text-muted" id="resetSubtitle">Enter a new password for your account.</p>
  </div>

  <div class="card">
    <div id="errorBox" class="error-banner" style="display: none;"></div>
    <div id="successBox" style="display: none; background: #22C55E10; border: 1px solid #22C55E30; border-radius: var(--radius); padding: 12px; margin-bottom: 14px; font-size: 13px; color: #166534;"></div>

    <div id="resetForm" style="display: flex; flex-direction: column; gap: 14px;">
      <input id="newPassword" type="password" placeholder="New password (min 6 characters)" class="input" autocomplete="new-password">
      <button id="resetBtn" class="btn-primary" style="width: 100%; justify-content: center;" onclick="handleReset()">Set new password</button>
    </div>

    <div class="text-center" style="margin-top: 20px;">
      <a href="/login.html" class="text-sm" style="color: var(--primary); text-decoration: underline;">Back to sign in</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  storageBucket: "vdrive-64deb.firebasestorage.app",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const auth = firebase.auth()

const params = new URLSearchParams(window.location.search)
const mode = params.get('mode')
const oobCode = params.get('oobCode')

if (mode === 'resetPassword' && oobCode) {
  document.getElementById('resetSubtitle').textContent = 'Enter a new password for your account.'
} else {
  document.getElementById('resetForm').innerHTML = `
    <input id="resetEmail" type="email" placeholder="Your email address" class="input">
    <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="sendResetEmail()">Send reset email</button>
  `
  document.getElementById('resetSubtitle').textContent = 'Enter your email and we\'ll send a reset link.'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

function showSuccess(msg) {
  const el = document.getElementById('successBox')
  el.textContent = msg; el.style.display = 'block';
}

async function handleReset() {
  const password = document.getElementById('newPassword').value
  showError('')
  if (password.length < 6) { showError('Password must be at least 6 characters'); return }
  try {
    await auth.confirmPasswordReset(oobCode, password)
    showSuccess('Password reset successful! Redirecting to sign in...')
    setTimeout(() => { window.location.href = '/login.html' }, 2000)
  } catch (e) { showError(e.message) }
}

async function sendResetEmail() {
  const email = document.getElementById('resetEmail').value
  showError('')
  if (!email) { showError('Enter your email'); return }
  try {
    await auth.sendPasswordResetEmail(email)
    showSuccess('Reset email sent! Check your inbox.')
  } catch (e) { showError(e.message) }
}
</script>
</body>
</html>
