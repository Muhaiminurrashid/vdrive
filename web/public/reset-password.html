<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Virtual Pendrive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-canvas grid-dots">

<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary mx-auto mb-3"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <h1 class="font-medium text-primary text-3xl tracking-tight mb-1">Reset password</h1>
    <p class="text-sm text-muted" id="resetSubtitle">Enter a new password for your account.</p>
  </div>

  <div class="bg-surface-card border border-hairline rounded-2xl overflow-hidden">
    <div class="h-1 bg-primary"></div>
    <div class="p-6">
      <div id="errorBox" class="bg-error/8 text-error px-4 py-2 rounded-lg text-sm mb-4 hidden"></div>
      <div id="successBox" class="hidden bg-success/8 border border-success/20 px-3 py-3 rounded-lg text-sm text-green-800 mb-3.5"></div>

      <div id="resetForm" class="flex flex-col gap-3.5">
        <input id="newPassword" type="password" placeholder="New password (min 6 characters)" class="w-full h-10 px-3.5 py-2.5 rounded-lg border border-hairline bg-surface-card text-ink text-sm outline-none focus:border-primary focus:ring-3 focus:ring-primary/12" autocomplete="new-password">
        <button id="resetBtn" class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active w-full justify-center inline-flex items-center" onclick="handleReset()">Set new password</button>
      </div>

      <div class="text-center mt-5">
        <a href="/login.html" class="text-sm text-primary underline hover:text-primary-active">Back to sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  storageBucket: "vdrive-64deb.firebasestorage.app",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const auth = firebase.auth()

const params = new URLSearchParams(window.location.search)
const mode = params.get('mode')
const oobCode = params.get('oobCode')

if (mode === 'resetPassword' && oobCode) {
  document.getElementById('resetSubtitle').textContent = 'Enter a new password for your account.'
} else {
  document.getElementById('resetForm').innerHTML = `
    <input id="resetEmail" type="email" placeholder="Your email address" class="w-full h-10 px-3.5 py-2.5 rounded-lg border border-hairline bg-surface-card text-ink text-sm outline-none focus:border-primary focus:ring-3 focus:ring-primary/12">
    <button class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active w-full justify-center inline-flex items-center" onclick="sendResetEmail()">Send reset email</button>
  `
  document.getElementById('resetSubtitle').textContent = "Enter your email and we'll send a reset link."
}

function authErrorMessage(e) {
  const m = { 'invalid-credential':'Incorrect email or password', 'user-not-found':'Incorrect email or password', 'wrong-password':'Incorrect email or password', 'email-already-in-use':'An account with this email already exists', 'weak-password':'Password must be at least 6 characters', 'invalid-email':'Invalid email address', 'too-many-requests':'Too many attempts. Try again later.', 'network-request-failed':'Network error. Check your connection.', 'expired-action-code':'Reset link expired. Request a new one.', 'invalid-action-code':'Invalid reset link.' }
  const c = e.code || ''
  for (const k in m) { if (c.includes(k)) return m[k] }
  return 'Something went wrong'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
  else { el.classList.add('hidden'); }
}

function showSuccess(msg) {
  const el = document.getElementById('successBox')
  el.textContent = msg; el.classList.remove('hidden');
}

async function handleReset() {
  const password = document.getElementById('newPassword').value
  showError('')
  if (password.length < 6) { showError('Password must be at least 6 characters'); return }
  try {
    await auth.confirmPasswordReset(oobCode, password)
    showSuccess('Password reset successful! Redirecting to sign in...')
    setTimeout(() => { window.location.href = '/login.html' }, 2000)
  } catch (e) { showError(authErrorMessage(e)) }
}

async function sendResetEmail() {
  const email = document.getElementById('resetEmail').value
  showError('')
  if (!email) { showError('Enter your email'); return }
  try {
    await auth.sendPasswordResetEmail(email)
    showSuccess('Reset email sent! Check your inbox.')
  } catch (e) { showError(authErrorMessage(e)) }
}
</script>
</body>
</html>
