<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Files — Virtual Pendrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<header class="h-14 px-6 border-b border-hairline bg-surface-card flex items-center justify-between">
  <a href="/" class="flex items-center gap-2 text-sm font-semibold text-primary tracking-tight">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    <span class="hidden sm:inline">Virtual Pendrive</span>
  </a>
  <div class="flex items-center gap-3">
    <span id="userEmail" class="text-sm text-muted font-normal hidden sm:inline"></span>
    <a href="#" onclick="handleChangePassword()" class="text-sm text-muted underline">Password</a>
    <a href="#" onclick="handleLogout()" class="text-sm text-muted underline">Sign out</a>
  </div>
</header>

<main class="max-w-[680px] mx-auto px-6 py-8">

  <div class="flex gap-3 mb-7 flex-wrap">
    <label class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active inline-flex items-center cursor-pointer">
      <span id="uploadLabel">Upload file</span>
      <input id="fileInput" type="file" class="hidden" onchange="handleUpload(this)">
    </label>
    <button id="shareBtn" class="bg-surface-card border border-hairline text-ink rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-surface-soft inline-flex items-center disabled:opacity-50 disabled:cursor-not-allowed" onclick="shareSelected()" disabled>Share selected</button>
  </div>

  <div id="folderBar" class="flex gap-3 mb-3 flex-wrap items-center">
    <div id="breadcrumb" class="flex gap-2 flex-1 items-center flex-wrap"></div>
    <button class="bg-surface-card border border-hairline text-ink rounded-lg text-xs h-8.5 px-3.5 font-medium hover:bg-surface-soft inline-flex items-center" onclick="createFolder()">+ Folder</button>
    <button id="deleteFolderBtn" class="hidden bg-transparent border-none text-xs text-error cursor-pointer px-1 py-1" onclick="deleteCurrentFolder()">Delete folder</button>
  </div>

  <div id="codeDisplay" class="bg-surface-card border border-hairline rounded-xl p-6 mb-7 hidden">
    <p class="text-sm font-semibold text-ink mb-0.5">Classroom Access Code</p>
    <p class="text-sm text-muted mb-3.5">Share this code. Expires in 15 minutes.</p>
    <div class="flex gap-3">
      <span id="codeValue" class="font-mono bg-surface-dark text-on-dark px-5 py-3 rounded-lg text-2xl font-bold tracking-[0.3em]"></span>
      <button id="copyBtn" class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active inline-flex items-center" onclick="copyCode()">Copy</button>
    </div>
  </div>

  <!-- ponytail: storage bar, no separate query, computed from loaded files -->
  <div class="bg-surface-card border border-hairline rounded-xl p-4 mb-7">
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-sm font-semibold text-primary">Storage</span>
      <span id="storageText" class="text-xs text-muted-soft">0 MB / 1 GB</span>
    </div>
    <div class="h-1.5 bg-hairline rounded-full overflow-hidden">
      <div id="storageFill" class="h-full w-0 bg-primary rounded-full transition-[width] duration-300"></div>
    </div>
  </div>

  <p id="fileCount" class="text-sm text-muted mb-3.5"></p>

  <div id="fileList"></div>

  <!-- ponytail: context menu for folders/files -->
  <div id="contextMenu" class="hidden fixed bg-surface-card border border-hairline rounded-xl shadow-lg py-1 z-50 min-w-[140px]"></div>

  <div id="emptyState" class="border-2 border-dashed border-hairline rounded-xl p-12 text-center hidden">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-muted-soft mx-auto mb-3"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    <p class="font-serif font-normal text-lg text-primary mb-1">No files yet</p>
    <p class="text-sm text-muted">Upload your first lecture material to get started.</p>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const auth = firebase.auth()
const db = firebase.firestore()

// ponytail: set B2_PROXY_URL after deploying Worker
const B2_PROXY_URL = 'https://b2-proxy.muhaiminurrashid99.workers.dev'

auth.onAuthStateChanged(user => {
  if (!user) { window.location.href = '/login.html'; return }
  document.getElementById('userEmail').textContent = user.email
  window.currentUser = user
  window.currentFolderId = null
  window.folderPath = []
  loadFolders().then(() => loadContents())
})


// ponytail: native drag-drop upload, drop anywhere on page
document.addEventListener('dragover', e => e.preventDefault())
document.addEventListener('drop', e => {
  e.preventDefault()
  const file = e.dataTransfer?.files[0]
  if (file) handleUpload(file)
})

function handleLogout() { auth.signOut(); window.location.href = '/' }

async function handleChangePassword() {
  const newPass = prompt('Enter new password (min 6 characters):')
  if (!newPass || newPass.length < 6) return
  try {
    await window.currentUser.updatePassword(newPass)
    alert('Password changed successfully!')
  } catch (e) { alert(e.message) }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'
  return (bytes / 1048576).toFixed(1) + ' MB'
}

window.folderNames = {}

// ponytail: loads all folders once, filtered in-memory for current context
async function loadFolders() {
  if (!window.currentUser) return
  const snap = await db.collection('folders').where('userId', '==', window.currentUser.uid).get()
  window.folderNames = {}
  snap.docs.forEach(doc => {
    window.folderNames[doc.id] = doc.data().name
  })
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb')
  const parts = [{ id: null, name: 'My Files' }, ...window.folderPath]
  el.innerHTML = parts.map((p, i) => {
    const last = i === parts.length - 1
    if (last) {
      return `<span class="text-sm text-ink">${p.name}</span>`
    }
    return `<span class="text-sm text-primary cursor-pointer" onclick="navigateToBreadcrumb(${i})">${p.name}</span><span class="text-xs text-muted-soft mx-1">›</span>`
  }).join('')
  document.getElementById('deleteFolderBtn').classList.toggle('hidden', !window.currentFolderId)
}

function navigateToFolder(id) {
  const folder = window.folderNames[id]
  if (!folder) return
  window.currentFolderId = id
  window.folderPath.push({ id, name: folder })
  renderBreadcrumb()
  loadContents()
}

function navigateUp() {
  if (window.folderPath.length === 0) return
  window.folderPath.pop()
  window.currentFolderId = window.folderPath.length > 0 ? window.folderPath[window.folderPath.length - 1].id : null
  renderBreadcrumb()
  loadContents()
}

function navigateToBreadcrumb(index) {
  if (index >= window.folderPath.length + 1) return
  window.folderPath = window.folderPath.slice(0, index)
  window.currentFolderId = index === 0 ? null : window.folderPath[index - 1].id
  renderBreadcrumb()
  loadContents()
}

async function createFolder() {
  const name = prompt('Folder name:')
  if (!name) return
  await db.collection('folders').add({
    name,
    userId: window.currentUser.uid,
    parentId: window.currentFolderId || null,
    createdAt: firebase.firestore.Timestamp.now()
  })
  await loadFolders()
  loadContents()
}

async function deleteCurrentFolder() {
  const folderId = window.currentFolderId
  if (!folderId || !confirm('Delete this folder? Files and sub-folders will be detached.')) return
  await deleteFolderById(folderId)
  navigateUp()
}

// ponytail: shared helper, used by both delete btn and context menu
async function deleteFolderById(folderId) {
  const fileSnap = await db.collection('files').where('folderId', '==', folderId).get()
  const batch = db.batch()
  fileSnap.docs.forEach(doc => batch.update(doc.ref, { folderId: null }))
  const subSnap = await db.collection('folders').where('parentId', '==', folderId).get()
  subSnap.docs.forEach(doc => batch.update(doc.ref, { parentId: null }))
  await batch.commit()
  await db.collection('folders').doc(folderId).delete()
}

function getFileType(name) {
  const map = { pdf: 'PDF', pptx: 'PPT', ppt: 'PPT', docx: 'DOC', doc: 'DOC', mp4: 'Video', xlsx: 'XLS', zip: 'ZIP' }
  const ext = name.split('.').pop().toLowerCase()
  return map[ext] || ext.toUpperCase()
}

const fileTypeColors = {
  PDF: 'text-file-pdf', PPT: 'text-file-ppt', DOC: 'text-file-doc',
  Video: 'text-file-video', XLS: 'text-file-ppt', ZIP: 'text-file-zip'
}

function fileTypeColor(type) {
  return fileTypeColors[type] || 'text-muted-soft'
}

// ponytail: loads both sub-folders + files for current folder context, filters in-memory
async function loadContents() {
  const user = window.currentUser
  if (!user) return
  const [fileSnap, folderSnap] = await Promise.all([
    db.collection('files').where('userId', '==', user.uid).get(),
    db.collection('folders').where('userId', '==', user.uid).get()
  ])

  const folderId = window.currentFolderId
  const files = []
  fileSnap.forEach(doc => {
    const d = doc.data()
    if ((d.folderId || null) === folderId) files.push({ id: doc.id, ...d })
  })
  const subFolders = []
  folderSnap.forEach(doc => {
    const d = doc.data()
    if ((d.parentId || null) === folderId) subFolders.push({ id: doc.id, name: d.name })
  })

  const list = document.getElementById('fileList')
  const empty = document.getElementById('emptyState')
  list.innerHTML = ''

  const totalBytes = fileSnap.docs.reduce((sum, d) => sum + (d.data().size || 0), 0)
  const maxBytes = 1_000_000_000
  document.getElementById('storageText').textContent = formatBytes(totalBytes) + ' / 1 GB'
  document.getElementById('storageFill').style.width = Math.min(100, (totalBytes / maxBytes) * 100) + '%'

  const fileCount = files.length
  const folderCount = subFolders.length
  let countText = fileCount + ' file' + (fileCount !== 1 ? 's' : '')
  if (folderCount) countText += ' · ' + folderCount + ' folder' + (folderCount !== 1 ? 's' : '')
  document.getElementById('fileCount').textContent = countText

  if (files.length === 0 && subFolders.length === 0) {
    empty.classList.remove('hidden')
    return
  }
  empty.classList.add('hidden')

  // ponytail: sub-folders rendered first (Google Drive convention), then files
  subFolders.forEach(folder => {
    const el = document.createElement('div')
    el.className = 'flex items-center justify-between bg-surface-card border border-hairline rounded-xl px-4 py-3 mb-2 cursor-pointer hover:shadow-sm'
    el.onclick = () => navigateToFolder(folder.id)
    el.oncontextmenu = (e) => showContextMenu(e, [
      { label: 'Rename', onclick: `renameFolder('${folder.id}', '${folder.name.replace(/'/g, "\\'")}')` },
      { label: 'Delete', danger: true, onclick: `if(confirm('Delete this folder? Files and sub-folders will be detached.')){deleteFolderById('${folder.id}').then(()=>loadFolders().then(()=>loadContents()))}` }
    ])
    el.innerHTML = `<div class="flex gap-3 flex-1 items-center py-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary shrink-0"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <span class="text-sm text-ink font-medium">${folder.name}</span>
    </div>`
    list.appendChild(el)
  })

  files.forEach(f => {
    const t = getFileType(f.name)
    const el = document.createElement('div')
    el.className = 'flex items-center bg-surface-card border border-hairline rounded-xl px-4 py-3 mb-2 hover:shadow-sm'

    const cb = document.createElement('input')
    cb.type = 'checkbox'
    cb.className = 'accent-primary size-4 cursor-pointer shrink-0 mr-3'
    cb.dataset.id = f.id
    cb.onchange = updateShareBtn

    const nameLink = document.createElement('a')
    nameLink.href = '#'
    nameLink.className = 'flex gap-3 min-w-0 items-center flex-1'
    nameLink.innerHTML = `<span class="text-xs font-semibold uppercase tracking-wider ${fileTypeColor(t)} shrink-0">${t}</span><span class="truncate text-sm text-ink">${f.name}</span><span class="text-xs text-muted shrink-0 ml-2">${formatBytes(f.size)}</span>`
    nameLink.onclick = async (e) => {
      e.preventDefault()
      if (!f.b2FileName) return
      try {
        const res = await fetch(`${B2_PROXY_URL}/api/download-url?fileName=${encodeURIComponent(f.b2FileName)}`)
        if (!res.ok) throw new Error('Download service unavailable')
        const { url } = await res.json()
        const a = document.createElement('a')
        a.href = url; a.download = f.name; a.click()
      } catch (e) { alert('Download failed: ' + e.message) }
    }
    nameLink.oncontextmenu = (e) => showContextMenu(e, [
      { label: 'Move to', onclick: `moveFileToFolder('${f.id}')` },
      { label: 'Delete', danger: true, onclick: `if(confirm('Delete file?')){document.querySelector('[data-id="${f.id}"]').closest('div').querySelector('button').click()}` }
    ])

    const delBtn = document.createElement('button')
    delBtn.textContent = 'Delete'
    delBtn.className = 'bg-transparent border-none text-xs text-muted-soft cursor-pointer ml-3 shrink-0 hover:text-error'
    delBtn.onclick = async () => {
      delBtn.textContent = 'Deleting...'
      delBtn.disabled = true
      try {
        if (f.b2FileId && f.b2FileName) {
          const res = await fetch(`${B2_PROXY_URL}/api/delete`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fileId: f.b2FileId, fileName: f.b2FileName })
          })
          if (!res.ok) throw new Error('Delete failed')
        }
        await db.collection('files').doc(f.id).delete()
        loadContents()
      } catch (e) { alert('Delete failed: ' + e.message); loadContents() }
    }

    el.appendChild(cb)
    el.appendChild(nameLink)
    el.appendChild(delBtn)
    list.appendChild(el)
  })
}

// ponytail: accepts <input> or raw File (from drag-drop)
async function handleUpload(inputOrFile) {
  const file = inputOrFile.files ? inputOrFile.files[0] : inputOrFile
  if (!file || !window.currentUser) return
  // ponytail: 100 MB limit, B2 has no real cap but keeps free tier sane
  if (file.size > 100 * 1024 * 1024) { alert('File too large (max 100 MB)'); return }
  document.getElementById('uploadLabel').textContent = 'Uploading...'
  try {
    const { uploadUrl, authToken } = await fetch(`${B2_PROXY_URL}/api/upload-url`).then(r => r.json())
    // ponytail: prefix with userId+timestamp to avoid collisions in public bucket
    const b2FileName = `${window.currentUser.uid}_${Date.now()}_${file.name}`
    const b2Res = await fetch(uploadUrl, {
      method: 'POST',
      headers: {
        Authorization: authToken,
        'X-Bz-File-Name': encodeURIComponent(b2FileName),
        'Content-Type': file.type || 'application/octet-stream',
        'X-Bz-Content-Sha1': 'do_not_verify'
      },
      body: file
    })
    if (!b2Res.ok) throw new Error(await b2Res.text())
    const b2Result = await b2Res.json()
    await db.collection('files').add({
      name: file.name, size: file.size, type: file.type,
      userId: window.currentUser.uid,
      b2FileId: b2Result.fileId,
      b2FileName: b2FileName,
      folderId: window.currentFolderId || null,
      createdAt: firebase.firestore.Timestamp.now(),
    })
  } catch (e) { alert('Upload failed: ' + e.message) }
  document.getElementById('uploadLabel').textContent = 'Upload file'
  if (inputOrFile.files) inputOrFile.value = ''
  loadContents()
}

function updateShareBtn() {
  const checked = document.querySelectorAll('#fileList input[type="checkbox"]:checked').length
  document.getElementById('shareBtn').disabled = checked === 0
}

async function shareSelected() {
  const user = window.currentUser
  if (!user) return
  const checks = document.querySelectorAll('#fileList input[type="checkbox"]:checked')
  const fileIds = Array.from(checks).map(c => c.dataset.id)
  if (fileIds.length === 0) return
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  const code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('')
  const expiresAt = new Date(Date.now() + 15 * 60 * 1000)
  await db.collection('accessCodes').add({
    code, userId: user.uid, fileIds,
    expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt),
    createdAt: firebase.firestore.Timestamp.now(),
  })
  document.getElementById('codeValue').textContent = code
  document.getElementById('codeDisplay').classList.remove('hidden')
  window.lastCode = code
  checks.forEach(c => c.checked = false)
  updateShareBtn()
}

function copyCode() {
  if (window.lastCode) {
    navigator.clipboard.writeText(window.lastCode)
    document.getElementById('copyBtn').textContent = 'Copied!'
    setTimeout(() => { document.getElementById('copyBtn').textContent = 'Copy' }, 2000)
  }
}

// ponytail: context menu for folders and files — prompt-based rename/move, no inline edit or drag-drop
function showContextMenu(e, items) {
  e.preventDefault()
  const menu = document.getElementById('contextMenu')
  menu.innerHTML = items.map(item =>
    `<div class="px-4 py-2 text-sm cursor-pointer hover:bg-surface-soft ${item.danger ? 'text-error' : 'text-ink'}" onclick="${item.onclick}">${item.label}</div>`
  ).join('')
  menu.style.left = e.clientX + 'px'
  menu.style.top = e.clientY + 'px'
  menu.classList.remove('hidden')
}

document.addEventListener('click', () => {
  document.getElementById('contextMenu').classList.add('hidden')
})

async function renameFolder(id, oldName) {
  const newName = prompt('Rename folder:', oldName)
  if (!newName || newName === oldName) return
  await db.collection('folders').doc(id).update({ name: newName })
  await loadFolders()
  loadContents()
}

async function moveFileToFolder(fileId) {
  const folders = Object.entries(window.folderNames).map(([id, name]) => ({ id, name }))
  const choices = ['My Files (root)', ...folders.map(f => f.name)]
  const choice = prompt('Move to folder:\n' + choices.map((c, i) => `${i}. ${c}`).join('\n') + '\n\nEnter number:')
  if (choice === null) return
  const idx = parseInt(choice)
  if (isNaN(idx) || idx < 0 || idx > folders.length) return
  const targetFolderId = idx === 0 ? null : folders[idx - 1].id
  await db.collection('files').doc(fileId).update({ folderId: targetFolderId })
  loadContents()
}
</script>
</body>
</html>
