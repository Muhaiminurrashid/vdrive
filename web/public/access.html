<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Access — Virtual Pendrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<nav class="h-14 px-6 border-b border-hairline bg-surface-card flex items-center justify-between">
  <a href="/" class="flex items-center gap-2 text-sm font-semibold text-primary tracking-tight">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 01-8 0"/>
    </svg>
    Virtual Pendrive
  </a>
</nav>

<main class="min-h-[calc(100vh-56px)] flex items-center justify-center p-6">
  <div id="codeEntry" class="w-full max-w-sm">
    <div class="text-center mb-8">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary mx-auto mb-3"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <h1 class="font-serif font-normal text-primary text-3xl tracking-tight mb-1">Classroom Access</h1>
      <p class="text-sm text-muted">Enter the code your teacher shared</p>
    </div>

    <div class="bg-surface-card border border-hairline rounded-2xl overflow-hidden">
      <div class="h-1 bg-primary"></div>
      <div class="p-6">
        <div id="errorBox" class="bg-error/8 text-error px-4 py-2 rounded-lg text-sm mb-4 hidden"></div>
        <div class="flex flex-col gap-4">
          <input id="codeInput" type="text" placeholder="Enter code" maxlength="6" class="w-full h-13 px-3.5 rounded-lg border border-hairline bg-surface-card text-ink font-mono text-2xl font-bold text-center tracking-[0.3em] outline-none focus:border-primary focus:ring-3 focus:ring-primary/12 uppercase" oninput="this.value=this.value.toUpperCase()">
          <button id="accessBtn" class="bg-primary text-on-primary rounded-lg px-5 py-2.5 text-sm font-medium hover:bg-primary-active w-full justify-center h-11 inline-flex items-center" onclick="handleAccess()">Access files</button>
        </div>
      </div>
    </div>

    <p class="text-center text-xs mt-5 text-muted-soft">
      <a href="/" class="text-muted-soft underline hover:text-primary">Back to home</a>
    </p>
  </div>

  <div id="fileView" class="w-full max-w-lg hidden">
    <div class="text-center mb-8">
      <h1 class="font-serif font-normal text-primary text-2xl tracking-tight mb-1">Files shared with you</h1>
      <p class="text-sm text-muted">
        Code <span id="displayCode" class="font-mono font-bold tracking-wider text-ink"></span> —
        <button onclick="resetAccess()" class="bg-transparent border-none text-sm text-primary cursor-pointer">enter a different code</button>
      </p>
    </div>
    <div id="fileList"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC4LhzNvivwitunV6qJp3-Pb6UjyDXPoLU",
  authDomain: "vdrive-64deb.firebaseapp.com",
  projectId: "vdrive-64deb",
  storageBucket: "vdrive-64deb.firebasestorage.app",
  messagingSenderId: "541773803308",
  appId: "1:541773803308:web:f2c49d374a13abb8920689",
}
firebase.initializeApp(firebaseConfig)
const db = firebase.firestore()
const B2_PROXY_URL = 'https://b2-proxy.muhaiminurrashid99.workers.dev'

function userErrorMessage(e) {
  const m = e.message || ''
  if (m.includes('permission') || m.includes('Permission')) return 'Permission denied'
  if (m.includes('unavailable') || m.includes('network') || m.includes('Failed to fetch')) return 'Service unavailable. Try again.'
  return 'Something went wrong'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.classList.remove('hidden'); }
  else { el.classList.add('hidden'); }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'
  return (bytes / 1048576).toFixed(1) + ' MB'
}

function getFileType(name) {
  const map = { pdf: 'PDF', pptx: 'PPT', ppt: 'PPT', docx: 'DOC', doc: 'DOC', mp4: 'Video', xlsx: 'XLS', zip: 'ZIP' }
  const ext = name.split('.').pop().toLowerCase()
  return map[ext] || ext.toUpperCase()
}

const fileTypeColors = {
  PDF: 'text-file-pdf', PPT: 'text-file-ppt', DOC: 'text-file-doc',
  Video: 'text-file-video', XLS: 'text-file-ppt', ZIP: 'text-file-zip'
}

function fileTypeColor(type) {
  return fileTypeColors[type] || 'text-muted-soft'
}

async function handleAccess() {
  const code = document.getElementById('codeInput').value.toUpperCase()
  if (code.length !== 6) return
  showError('')
  document.getElementById('accessBtn').disabled = true
  document.getElementById('accessBtn').textContent = 'Checking...'
  try {
    const snap = await db.collection('accessCodes').where('code', '==', code).get()
    if (snap.empty) { showError('Invalid code'); return }
    const data = snap.docs[0].data()
    const exp = data.expiresAt
    const expired = typeof exp === 'number' ? exp < Date.now() : exp.toDate() < new Date()
    if (expired) { showError('Code expired'); return }
    const fileIds = data.fileIds || []
    const items = await Promise.all(fileIds.map(async id => {
      const metaSnap = await db.collection('files').doc(id).get()
      if (!metaSnap.exists) return null
      const meta = metaSnap.data()
      if (!meta.b2FileName) return null
      return { name: meta.name, b2FileName: meta.b2FileName, size: meta.size || 0 }
    }))
    const filtered = items.filter(Boolean)
    document.getElementById('displayCode').textContent = code
    const list = document.getElementById('fileList')
    list.innerHTML = ''
    if (filtered.length === 0) {
      list.innerHTML = '<p class="text-center text-sm text-muted py-8">No files available for this code.</p>'
    } else {
      filtered.forEach(f => {
        const t = getFileType(f.name)
        const el = document.createElement('div')
        el.className = 'flex items-center justify-between bg-surface-card border border-hairline rounded-xl px-4 py-3 mb-2 hover:shadow-sm cursor-pointer'
        el.onclick = async () => {
          try {
            const res = await fetch(`${B2_PROXY_URL}/api/download`, {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ fileName: f.b2FileName })
            })
            if (!res.ok) throw new Error()
            const blob = await res.blob()
            const url = URL.createObjectURL(blob)
            const a = document.createElement('a'); a.href = url; a.download = f.name; a.click()
            URL.revokeObjectURL(url)
          } catch(e) { alert('Download failed') }
        }
        el.innerHTML = `
          <div class="flex gap-3 min-w-0 items-center">
            <span class="text-xs font-semibold uppercase tracking-wider ${fileTypeColor(t)}">${t}</span>
            <span class="truncate text-sm text-ink">${f.name}</span>
          </div>
          <div class="flex items-center shrink-0 ml-3 gap-2.5">
            <span class="text-xs text-muted">${formatBytes(f.size)}</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="shrink-0 text-muted-soft">
              <path d="M4 8h8M8 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>`
        list.appendChild(el)
      })
    }
    document.getElementById('codeEntry').classList.add('hidden')
    document.getElementById('fileView').classList.remove('hidden')
  } catch (e) { showError(userErrorMessage(e)) }
  document.getElementById('accessBtn').disabled = false
  document.getElementById('accessBtn').textContent = 'Access files'
}

function resetAccess() {
  document.getElementById('codeEntry').classList.remove('hidden')
  document.getElementById('fileView').classList.add('hidden')
  document.getElementById('codeInput').value = ''
}
</script>
</body>
</html>
