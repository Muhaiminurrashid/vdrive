<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Access - Virtual Pendrive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@350..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<style>
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes fadeSlideUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
html.dark {
  --color-canvas: #0d1117;
  --color-surface-card: #151922;
  --color-surface-soft: #1c2130;
  --color-surface-dark: #0a0d14;
  --color-ink: #e8eaed;
  --color-body: #c9cdd3;
  --color-muted: #9aa0a8;
  --color-muted-soft: #7a8088;
  --color-primary: #6B8FC4;
  --color-primary-active: #5A7DB0;
  --color-on-primary: #ffffff;
  --color-hairline: #2b2f3b;
  --color-on-dark: #e8eaed;
  --color-on-dark-soft: #9aa0a8;
  --color-primary-disabled: var(--color-hairline);
  --color-hairline-soft: #222736;
}

.otp-wrap { display:flex; gap:8px; justify-content:center; }
.otp-input {
  width:44px; height:52px; text-align:center; font-family:"JetBrains Mono",monospace;
  font-size:24px; font-weight:700; text-transform:uppercase;
  border:1.5px solid var(--color-hairline); border-radius:8px;
  background:var(--color-surface-card); color:var(--color-ink);
  outline:none; transition:border-color .15s,box-shadow .15s;
}
.otp-input:focus { border-color:var(--color-primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--color-primary) 15%, transparent); }
.otp-input.filled { border-color:var(--color-primary); background:rgba(59,92,154,.04); }
#codeEntry, #fileView { transition:opacity .25s,transform .3s; }
#codeEntry.hidden, #fileView.hidden { opacity:0; transform:translateY(12px); pointer-events:none; position:absolute; }
#fileView:not(.hidden) .file-card { animation:fadeSlideUp .35s ease backwards; }
#fileView:not(.hidden) .file-card:nth-child(1) { animation-delay:0s; }
#fileView:not(.hidden) .file-card:nth-child(2) { animation-delay:.06s; }
#fileView:not(.hidden) .file-card:nth-child(3) { animation-delay:.12s; }
#fileView:not(.hidden) .file-card:nth-child(4) { animation-delay:.18s; }
#fileView:not(.hidden) .file-card:nth-child(5) { animation-delay:.24s; }
#fileView:not(.hidden) .file-card:nth-child(6) { animation-delay:.3s; }
#fileView:not(.hidden) .file-card:nth-child(n+7) { animation-delay:.36s; }
.file-card { transition:box-shadow .2s,transform .2s; cursor:pointer; }
.file-card:hover { transform:translateY(-1px); box-shadow:0 2px 8px rgba(20,20,19,.08); }
html.dark .file-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.25); }
#previewOverlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:400; display:none; align-items:center; justify-content:center; }
#previewOverlay.show { display:flex; }
#previewBox { position:relative; max-width:90vw; max-height:90vh; background:var(--color-surface-card); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
#previewClose { position:absolute; top:12px; right:12px; width:36px; height:36px; border:none; background:rgba(0,0,0,.4); border-radius:50%; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; z-index:1; }
#previewClose:hover { background:rgba(0,0,0,.6); }
#previewContent { display:flex; align-items:center; justify-content:center; flex:1; overflow:auto; }
#previewContent img { max-width:100%; max-height:85vh; object-fit:contain; }
#previewContent video { max-width:100%; max-height:85vh; }
#previewContent audio { width:80vw; max-width:500px; }
#previewContent embed { width:90vw; height:85vh; border:none; }
#previewContent pre { padding:24px; font-size:13px; overflow:auto; max-height:85vh; max-width:90vw; white-space:pre-wrap; word-break:break-all; }
#previewFallback { padding:48px; text-align:center; color:var(--color-muted); }
.grid-dots { background-image:radial-gradient(circle, var(--color-hairline) 1px, transparent 1px); background-size:24px 24px; }
</style>
</head>
<body class="grid-dots" style="background-color:var(--color-canvas);min-height:100vh;font-family:Inter,sans-serif;margin:0">

<nav style="height:56px;padding:0 24px;border-bottom:1px solid var(--color-hairline);background:var(--color-surface-card);display:flex;align-items:center;justify-content:space-between">
  <a href="/" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--color-primary);text-decoration:none;letter-spacing:-.01em">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block"><rect x="7" y="3" width="10" height="16" rx="2" fill="currentColor"/><rect x="9" y="19" width="6" height="3" rx="1" fill="currentColor"/></svg>
    Virtual Pendrive
  </a>
  <button id="darkToggle" style="width:32px;height:32px;border:none;background:transparent;color:var(--color-muted);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center" onclick="toggleDark()">
    <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</nav>

<main style="max-width:460px;margin:0 auto;padding:48px 24px;position:relative">

  <div id="codeEntry">
    <div style="background:var(--color-surface-card);border:1px solid var(--color-hairline);border-radius:16px;overflow:hidden">
      <div style="height:4px;background:var(--color-primary)"></div>
      <div style="padding:32px 28px 28px">
        <div style="text-align:center;margin-bottom:28px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" style="margin-bottom:12px"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div style="font-size:14px;font-weight:500;color:var(--color-ink)">Enter code</div>
          <div style="font-size:13px;color:var(--color-muted);margin-top:4px">Access shared files</div>
        </div>
        <div id="errorBox" style="display:none;background:rgba(198,69,69,.08);color:var(--color-error);padding:8px 16px;border-radius:8px;font-size:13px;margin-bottom:20px"></div>
        <div class="otp-wrap" id="otpContainer">
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off" autofocus>
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off">
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off">
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off">
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off">
          <input class="otp-input" maxlength="1" type="text" inputmode="text" autocomplete="off">
        </div>
      </div>
    </div>
    <div style="text-align:center;margin-top:20px">
      <a href="/" style="font-size:12px;color:var(--color-muted-soft);text-decoration:underline">Back to home</a>
    </div>
  </div>

  <div id="fileView" class="hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div>
        <div style="font-size:16px;font-weight:500;color:var(--color-ink)">Shared files</div>
        <div id="fileCount" style="font-size:13px;color:var(--color-muted);margin-top:2px"></div>
      </div>
      <button onclick="showCodeEntry()" style="border:none;background:transparent;color:var(--color-primary);font-size:13px;font-weight:500;cursor:pointer;padding:6px 10px;border-radius:6px">Enter a different code</button>
    </div>
    <div id="fileList"></div>
    <div style="text-align:center;margin-top:24px">
      <a href="/" style="font-size:12px;color:var(--color-muted-soft);text-decoration:underline">Back to home</a>
    </div>
  </div>

  <div id="previewOverlay" onclick="if(event.target===this)closePreview()">
    <div id="previewBox">
      <button id="previewClose" onclick="closePreview()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="previewContent"></div>
    </div>
  </div>
</main>

<script>
const B2_PROXY_URL = 'https://b2-proxy.muhaiminurrashid99.workers.dev'

function toggleDark() {
  document.documentElement.classList.toggle('dark')
  localStorage.setItem('vdriveDark', document.documentElement.classList.contains('dark') ? '1' : '')
}
if (localStorage.getItem('vdriveDark')) document.documentElement.classList.add('dark')

function userErrorMessage(e) {
  const m = e.message || ''
  if (m.includes('permission') || m.includes('Permission')) return 'Permission denied'
  if (m.includes('unavailable') || m.includes('network') || m.includes('Failed to fetch')) return 'Service unavailable. Try again.'
  return 'Something went wrong'
}

function showError(msg) {
  const el = document.getElementById('errorBox')
  if (msg) { el.textContent = msg; el.style.display = ''; }
  else { el.style.display = 'none'; }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'
  return (bytes / 1048576).toFixed(1) + ' MB'
}

function getCode() {
  let code = ''
  document.querySelectorAll('.otp-input').forEach(i => code += i.value.toUpperCase())
  return code
}

function showCodeEntry() {
  document.getElementById('fileView').classList.add('hidden')
  document.getElementById('codeEntry').style.position = ''
  document.getElementById('codeEntry').classList.remove('hidden')
  showError('')
  document.querySelectorAll('.otp-input').forEach((i, idx) => { i.value = ''; i.classList.remove('filled'); if (idx === 0) i.focus() })
}

function fileIconData(name) {
  const ext = name.split('.').pop().toLowerCase()
  const map = {
    pdf: { bg:'#C27A5C' },
    ppt: { bg:'#D4A373' },
    pptx: { bg:'#D4A373' },
    doc: { bg:'#7EB89E' },
    docx: { bg:'#7EB89E' },
    mp4: { bg:'#9B7FC8' },
    xlsx: { bg:'#D4A373' },
    zip: { bg:'#6c6a64' }
  }
  return map[ext] || { bg:'#8e8b82' }
}

function fileTypeLabel(name) {
  const ext = name.split('.').pop().toLowerCase()
  const map = {
    pdf:'PDF', pptx:'PPT', ppt:'PPT', docx:'DOC', doc:'DOC',
    mp4:'VIDEO', mp3:'AUDIO', xlsx:'XLS', zip:'ZIP',
    jpg:'IMG', jpeg:'IMG', png:'IMG', gif:'IMG', webp:'IMG', svg:'IMG'
  }
  return map[ext] || 'FILE'
}

// ponytail: OTP auto-advance, backspace, paste, auto-submit
function setupOtpInputs() {
  const inputs = document.querySelectorAll('.otp-input')
  inputs.forEach((input, idx) => {
    input.addEventListener('input', function() {
      const val = this.value.toUpperCase()
      if (val) this.classList.add('filled')
      else this.classList.remove('filled')
      if (val && idx < inputs.length - 1) inputs[idx + 1].focus()
      if (getCode().length === 6) handleAccess()
    })
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !this.value && idx > 0) {
        inputs[idx - 1].focus()
        inputs[idx - 1].value = ''
        inputs[idx - 1].classList.remove('filled')
        e.preventDefault()
      }
    })
    input.addEventListener('paste', function(e) {
      e.preventDefault()
      const data = (e.clipboardData || window.clipboardData).getData('text').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6)
      if (!data) return
      inputs.forEach((inp, i) => {
        inp.value = data[i] || ''
        if (data[i]) inp.classList.add('filled'); else inp.classList.remove('filled')
      })
      const nextEmpty = data.length < 6 ? data.length : 5
      inputs[nextEmpty].focus()
      if (data.length === 6) handleAccess()
    })
  })
}
setupOtpInputs()

async function handleAccess() {
  const code = getCode()
  if (code.length !== 6) return
  showError('')
  try {
    const res = await fetch(`${B2_PROXY_URL}/api/code-files`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    })
    if (res.status === 410) { showError('Code expired'); return }
    if (!res.ok) { showError('Invalid code'); return }
    const data = await res.json()
    const filtered = data.files || []
    const list = document.getElementById('fileList')
    list.innerHTML = ''
    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--color-muted);font-size:14px">No files available for this code.</div>'
    } else {
      document.getElementById('fileCount').textContent = filtered.length + ' file' + (filtered.length > 1 ? 's' : '')
      filtered.forEach((f, fi) => {
        const color = fileIconData(f.name).bg
        const card = document.createElement('div')
        card.className = 'file-card'
        card.style.cssText = 'display:flex;align-items:center;gap:14px;background:var(--color-surface-card);border:1px solid var(--color-hairline);border-radius:12px;padding:12px 16px;margin-bottom:10px'
        card.onclick = function() { previewFile(f) }
        card.innerHTML = '<span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:5px;text-transform:uppercase;letter-spacing:0.5px;color:' + color + ';background:' + color + '14;flex-shrink:0">' + fileTypeLabel(f.name) + '</span>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:14px;font-weight:500;color:var(--color-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + f.name + '</div>' +
            '<div style="font-size:12px;color:var(--color-muted);margin-top:2px">' + formatBytes(f.size) + '</div>' +
          '</div>' +
          '<button class="dl-btn" data-b2="' + f.b2FileName + '" data-name="' + f.name + '" style="padding:7px 14px;border:1px solid var(--color-hairline);border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:12px;color:var(--color-primary);font-weight:500;transition:background .15s" onmouseenter="this.style.background=\'var(--color-surface-soft)\'" onmouseleave="this.style.background=\'transparent\'">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            'Download</button>'
        card.querySelector('.dl-btn').onclick = async function(e) {
          e.stopPropagation()
          if (this.dataset.downloading) return
          this.dataset.downloading = '1'
          this.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="animation:spin 1s linear infinite"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Downloading...'
          try {
            const res = await fetch(B2_PROXY_URL + '/api/download', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ fileName: this.dataset.b2 })
            })
            if (!res.ok) { const body = await res.json().catch(()=>{}); throw new Error(body?.error || 'Download failed') }
            const blob = await res.blob()
            const url = URL.createObjectURL(blob)
            const a = document.createElement('a'); a.href = url; a.download = this.dataset.name; a.click()
            URL.revokeObjectURL(url)
            this.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Done'
            setTimeout(() => { this.innerHTML = '...' }, 2000)
          } catch(e) { alert(userErrorMessage(e)); this.innerHTML = '...' }
          setTimeout(() => { delete this.dataset.downloading; this.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download' }, 3000)
        }
        list.appendChild(card)
      })
    }
    document.getElementById('codeEntry').classList.add('hidden')
    document.getElementById('codeEntry').style.position = 'absolute'
    document.getElementById('fileView').classList.remove('hidden')
  } catch (e) { showError(userErrorMessage(e)) }
}

// ponytail: previewTypes + previewFile/closePreview from dashboard
const previewTypes = {
  jpg:1,jpeg:1,png:1,gif:1,webp:1,svg:1,bmp:1,
  mp4:1,webm:1,mov:1,avi:1,mkv:1,
  mp3:1,wav:1,ogg:1,m4a:1,
  pdf:1,
  txt:1,md:1,json:1,xml:1,csv:1,log:1,
  js:1,ts:1,py:1,java:1,kt:1,cpp:1,c:1,h:1,rs:1,go:1,rb:1,php:1,swift:1,yaml:1,yml:1,toml:1,ini:1,cfg:1,sql:1,sh:1,bat:1,ps1:1,html:1,css:1,scss:1,less:1
}
async function previewFile(f) {
  if (!f?.b2FileName) return
  const ext = f.name.split('.').pop().toLowerCase()
  if (!previewTypes[ext]) return
  const c = document.getElementById('previewContent')
  c.innerHTML = '<div style="padding:48px;color:var(--color-muted)">Loading...</div>'
  document.getElementById('previewOverlay').classList.add('show')
  try {
    const res = await fetch(B2_PROXY_URL + '/api/download', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fileName: f.b2FileName })
    })
    if (!res.ok) { const body = await res.json().catch(()=>{}); throw new Error(body?.error || 'Preview failed') }
    if (ext === 'pdf') { const blob = await res.blob(); c.innerHTML = '<embed src="' + URL.createObjectURL(blob) + '" type="application/pdf">'; return }
    if (['mp4','webm','mov','avi','mkv'].includes(ext)) { const blob = await res.blob(); c.innerHTML = '<video src="' + URL.createObjectURL(blob) + '" controls autoplay></video>'; return }
    if (['mp3','wav','ogg','m4a'].includes(ext)) { const blob = await res.blob(); c.innerHTML = '<audio src="' + URL.createObjectURL(blob) + '" controls autoplay></audio>'; return }
    if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) { const blob = await res.blob(); c.innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="' + f.name + '">'; return }
    c.innerHTML = '<pre>' + await res.text() + '</pre>'
  } catch(e) { c.innerHTML = '<div id="previewFallback">Preview unavailable</div>' }
}
function closePreview() {
  document.getElementById('previewOverlay').classList.remove('show')
  document.getElementById('previewContent').innerHTML = ''
}
</script>
</body>
</html>
